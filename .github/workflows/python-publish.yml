name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install release tooling and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run release tests
        run: python -m pytest -q

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Ensure release tag matches package version
        if: github.event_name == 'release'
        run: >-
          python -c "import os, MultiTrain;
          tag=os.environ['GITHUB_REF_NAME'].removeprefix('v');
          assert tag == MultiTrain.__version__,
          f'tag {tag!r} does not match version {MultiTrain.__version__!r}'"

      - name: Verify wheel can be installed
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import MultiTrain; print(MultiTrain.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified distributions
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/MultiTrain
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
