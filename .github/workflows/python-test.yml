name: CI

on:
  push:
    branches: [main, v2-test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.10"
          # Python 3.8 and 3.9 macOS wheels are available for x86_64.
          - os: macos-15-intel
            python-version: "3.8"
          - os: macos-15-intel
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements.txt

      - name: Check for syntax and undefined-name errors
        run: python -m ruff check .

      - name: Run test suite
        run: >-
          python -m pytest -q
          -W error::FutureWarning
          -W error::DeprecationWarning

  package:
    name: Verify distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Build and validate metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Verify wheel contents
        run: >-
          python -c "import glob, zipfile;
          wheel=glob.glob('dist/*.whl')[0];
          names=zipfile.ZipFile(wheel).namelist();
          assert not any('/test/' in name for name in names), names"

      - name: Install and import the wheel
        run: |
          python -m pip install dist/*.whl -c requirements.txt
          cd "$RUNNER_TEMP"
          python -c "import MultiTrain; print(MultiTrain.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
